[project]
name = "vietravel-tour-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "chromadb",
  "langchain",
  "langchain-community<0.4",
  "langchain-chroma",
  "langchain-openai",
  "langchain-google-genai>=4.0.0",
  "langgraph",
  "openpyxl",
  "pydantic>=2",
  "pydantic-settings",
  "pymupdf",
  "ragas",
  "streamlit",
  "tiktoken",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
